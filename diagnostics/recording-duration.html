  var SLOTS = ["--green", "--blue", "--amber", "--slate", "--red"];
  function slotColor(i) { return tok(SLOTS[i % SLOTS.length]); }
  function hex2rgb(h) { h = h.replace("#", ""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function rgb2hex(r) { return "#" + r.map(function (v) { return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2, "0"); }).join(""); }
  function seqColor(t) {
    t = Math.max(0, Math.min(1, t));
    var a = hex2rgb(tok("--blue-soft")), b = hex2rgb(tok("--blue"));
    return rgb2hex([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
  }
  // Contrast-computed ink, not a fixed threshold on the parametric t — picks whichever of
  // black/white actually has the higher WCAG contrast ratio against the resolved fill, so it's
  // correct for both themes' hues instead of guessing a brightness cutoff.
  function relLuminance(hex) {
    var c = hex2rgb(hex).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function inkForBg(hexBg) {
    var L = relLuminance(hexBg);
    var contrastBlack = (L + 0.05) / 0.05;
    var contrastWhite = 1.05 / (L + 0.05);
    return contrastBlack >= contrastWhite ? "#0b0b0b" : "#ffffff";
  }

      gdansk: { label: "w3", WEEKDAY: 24328, SATURDAY: 0, SUNDAY: 0 }
    }

  var r2 = {

    matched: { szczecin: [444340, 1105127, 1284586], poznan: [853579, 938261, 949529], lisbon: [964517, 2353167, 2780530], boston: [1540377, 3842932, 4301635], prague: [2965946, null, null] },

  // ================= CHART: matched-vs-window line, log scale =================
  function lineChart(svgId, legendId, data, windows) {
    var svg = document.getElementById(svgId);
    svg.innerHTML = "";
    var W = 520, H = 300, ML = 54, MR = 14, MT = 14, MB = 34;
    var pw = W - ML - MR, ph = H - MT - MB;
    var cities = data.cities;
    var allVals = [];
    cities.forEach(function (c) { data.matched[c].forEach(function (v) { if (v != null) allVals.push(v); }); });
    var lo = Math.log10(Math.min.apply(null, allVals) * 0.8);
    var hi = Math.log10(Math.max.apply(null, allVals) * 1.15);
    function xPos(i) { return ML + (i / (windows.length - 1)) * pw; }
    function yPos(v) { return MT + ph - ((Math.log10(v) - lo) / (hi - lo)) * ph; }

    var ticks = [];
    var loP = Math.floor(lo), hiP = Math.ceil(hi);
    for (var p = loP; p <= hiP; p++) [1,2,5].forEach(function (m) {
      var v = m * Math.pow(10, p);
      if (v >= Math.pow(10, lo) && v <= Math.pow(10, hi)) ticks.push(v);
    });
    ticks.forEach(function (v) {
      var y = yPos(v);
      el("line", { class: "grid-line", x1: ML, x2: W - MR, y1: y, y2: y }, svg);
      el("text", { x: ML - 8, y: y + 3, "text-anchor": "end", class: "muted" }, svg).textContent =
        v >= 1000000 ? (v/1000000) + "M" : v >= 1000 ? (v/1000) + "k" : v;
    });
    windows.forEach(function (w, i) {
      el("text", { x: xPos(i), y: H - 10, "text-anchor": "middle", class: "muted" }, svg).textContent = w;
    });
    el("line", { class: "axis-line", x1: ML, x2: ML, y1: MT, y2: H - MB }, svg);

    var legend = document.getElementById(legendId);
    legend.innerHTML = "";
    cities.forEach(function (city, ci) {
      var color = slotColor(ci);
      var vals = data.matched[city];
      var pts = [];
      vals.forEach(function (v, i) { if (v != null) pts.push([xPos(i), yPos(v), v, i]); });
      var path = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      el("path", { d: path, fill: "none", stroke: color, "stroke-width": 2 }, svg);
      pts.forEach(function (p) {
        var dot = el("circle", { cx: p[0], cy: p[1], r: 4, fill: color, stroke: tok("--paper"), "stroke-width": 1.5, style: "cursor:pointer" }, svg);
        dot.addEventListener("mousemove", function (e) {
          showTip("<b>" + cn(city) + "</b> · " + windows[p[3]] + "<br>" + loc().matchedObs + ": <b>" + fmt(p[2]) + "</b>", e);
        });
        dot.addEventListener("mouseleave", hideTip);
      });
      var note = flagNote(city);
      var item = document.createElement("div");
      item.className = "item";
      item.innerHTML = '<span class="swatch" style="background:' + color + '"></span>' +
        '<span' + (note ? ' style="color:var(--red)" title="' + note + '"' : "") + '>' + cn(city) + (note ? " ⚠" : "") + "</span>";
      legend.appendChild(item);
    });
  }

  // ================= CHART: heatmap matrix =================
  function heatmap(svgId, data, cities, windows, valSuffix, decimals) {
    var svg = document.getElementById(svgId);
    svg.innerHTML = "";
    var rowH = 32, colW = 92, ML = 96, MT = 10;
    var W = ML + colW * windows.length + 16;
    var H = MT + rowH * cities.length + 26;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var allVals = [];
    cities.forEach(function (c) { data[c].forEach(function (v) { if (v != null) allVals.push(v); }); });
    var vmin = Math.min.apply(null, allVals), vmax = Math.max.apply(null, allVals);
    var lineColor = tok("--line");

    windows.forEach(function (w, ci) {
      el("text", { class: "muted", "text-anchor": "middle", x: ML + ci * colW + colW / 2, y: MT + 10 }, svg).textContent = w;
    });

    cities.forEach(function (city, ri) {
      var y = MT + 20 + ri * rowH;
      var note = flagNote(city);
      var label = el("text", { class: "city-label", x: ML - 10, y: y + rowH / 2 + 4, "text-anchor": "end" }, svg);
      if (note) { label.innerHTML = '<tspan>' + cn(city) + '</tspan> <tspan fill="' + tok("--red") + '">⚠</tspan>'; }
      else { label.textContent = cn(city); }
      windows.forEach(function (w, ci) {
        var v = data[city][ci];
        var x = ML + ci * colW;
        var g = el("g", {}, svg);
        var t = v == null ? 0 : (vmax === vmin ? 0.5 : (v - vmin) / (vmax - vmin));
        var fill = v == null ? lineColor : seqColor(t);
        el("rect", { x: x, y: y, width: colW - 4, height: rowH - 4, rx: 5, fill: fill }, g);
        // fill is set via inline style, not the fill attribute: the .chart-card svg text CSS
        // rule (var(--ink-muted)) beats a presentation attribute in the cascade regardless of
        // selector specificity, so a plain fill="..." here would be silently overridden.
        var txt = el("text", { x: x + (colW - 4) / 2, y: y + (rowH - 4) / 2 + 4, "text-anchor": "middle", "font-size": "11.5px", "font-weight": "700", style: "fill:" + inkForBg(fill) }, g);
        txt.textContent = v == null ? "—" : fmt(v, decimals) + valSuffix;
        g.style.cursor = "pointer";
        g.addEventListener("mousemove", function (e) {
          var noteHtml = note ? "<br><span style='opacity:.75'>⚠ " + note + "</span>" : "";
          showTip("<b>" + cn(city) + "</b> · " + w + "<br>" + loc().value + ": <b>" + (v == null ? loc().noData : fmt(v, decimals) + valSuffix) + "</b>" + noteHtml, e);
        });
        g.addEventListener("mouseleave", hideTip);
      });
    });
  }

  // ================= CHART: convergence lollipop =================
  function convergenceChart(svgId, legendId, groups) {
    var svg = document.getElementById(svgId);
    svg.innerHTML = "";
    var W = 1040, H = 340, ML = 54, MR = 14, MT = 20, MB = 68;
    var pw = W - ML - MR, ph = H - MT - MB;

    var allVals = [];
    groups.forEach(function (g) { g.items.forEach(function (it) { allVals.push(it.p90P50, it.p90P85); }); });
    var vmax = Math.max.apply(null, allVals) * 1.12;

    function yPos(v) { return MT + ph - (v / vmax) * ph; }
    [0, 5, 10, 15, 20, 25, 30].filter(function (v) { return v <= vmax; }).forEach(function (v) {
      var y = yPos(v);
      el("line", { class: "grid-line", x1: ML, x2: W - MR, y1: y, y2: y }, svg);
      el("text", { x: ML - 8, y: y + 3, "text-anchor": "end", class: "muted" }, svg).textContent = v + "s";
    });
    el("line", { class: "axis-line", x1: ML, x2: ML, y1: MT, y2: H - MB }, svg);

    var legend = document.getElementById(legendId);
    legend.innerHTML =
      '<div class="item"><span class="swatch" style="background:' + tok("--green") + '"></span>' + loc().legendMedianP50 + '</div>' +
      '<div class="item"><span class="swatch" style="background:' + tok("--blue") + '"></span>' + loc().legendMedianP85 + '</div>' +
      '<div class="item">' + loc().legendP90 + '</div>';

    var totalSlots = 0;
    groups.forEach(function (g) { totalSlots += g.items.length; });
    var gap = pw / (totalSlots + groups.length + 1);
    var slotW = gap * 1.6;
    var x = ML + gap * 0.6;

    groups.forEach(function (g) {
      var groupStartX = x;
      g.items.forEach(function (it) {
        var cx = x + slotW / 2;
        [{ key: "P50", v: it.dP50, p90: it.p90P50, color: tok("--green"), dx: -8 },
         { key: "P85", v: it.dP85, p90: it.p90P85, color: tok("--blue"), dx: 8 }].forEach(function (m) {
          var bx = cx + m.dx;
          var y0 = yPos(0), y1 = yPos(m.v), yp = yPos(m.p90);
          el("line", { x1: bx, x2: bx, y1: y1, y2: yp, stroke: m.color, "stroke-width": 1.5, opacity: 0.5 }, svg);
          var r = el("rect", { x: bx - 6, y: Math.min(y0, y1), width: 12, height: Math.max(y0 - y1, 2), rx: 3, fill: m.color, style: "cursor:pointer" }, svg);
          r.addEventListener("mousemove", function (e) {
            showTip("<b>" + cn(it.city) + "</b> · " + loc().groups[g.idx] + "<br>" + loc().medianDelta + m.key + "|: <b>" + fmt(m.v, 1) + " s</b><br>" + loc().p90Delta + m.key + "|: " + fmt(m.p90, 1) + " s", e);
          });
          r.addEventListener("mouseleave", hideTip);
          el("circle", { cx: bx, cy: yp, r: 2.5, fill: m.color }, svg);
        });
        el("text", { x: cx, y: H - MB + 18, "text-anchor": "middle", class: "muted" }, svg).textContent = cn(it.city);
        x += slotW;
      });
      var groupCenter = (groupStartX + x - slotW) / 2 + slotW / 2 - gap * 0.1;
      el("text", { x: groupCenter, y: H - MB + 38, "text-anchor": "middle", "font-weight": "600", style: "fill:" + tok("--ink") }, svg).textContent = loc().groups[g.idx];
      el("text", { x: groupCenter, y: H - MB + 52, "text-anchor": "middle", class: "muted" }, svg).textContent = loc().groupSubs[g.idx];
      x += gap;
    });
  }

  // ================= CHART: stacked day-type bars =================
  function daytypeChart(svgId, legendId, rounds) {
    var svg = document.getElementById(svgId);
    svg.innerHTML = "";
    var W = 1040, H = 310, ML = 54, MR = 14, MT = 16, MB = 56;
    var pw = W - ML - MR, ph = H - MT - MB;

    var allCities = [];
    rounds.forEach(function (r) { r.cities.forEach(function (c) { allCities.push({ city: c, d: r.daytypeLargest[c] }); }); });
    var totals = allCities.map(function (o) { return o.d.WEEKDAY + o.d.SATURDAY + o.d.SUNDAY; });
    var vmax = Math.max.apply(null, totals) * 1.08;

    function yPos(v) { return MT + ph - (v / vmax) * ph; }
    [0, 50000, 100000, 150000, 200000].filter(function (v) { return v <= vmax; }).forEach(function (v) {
      var y = yPos(v);
      el("line", { class: "grid-line", x1: ML, x2: W - MR, y1: y, y2: y }, svg);
      el("text", { x: ML - 8, y: y + 3, "text-anchor": "end", class: "muted" }, svg).textContent = v === 0 ? "0" : (v / 1000) + "k";
    });
    el("line", { class: "axis-line", x1: ML, x2: ML, y1: MT, y2: H - MB }, svg);

    var legend = document.getElementById(legendId);
    legend.innerHTML =
      '<div class="item"><span class="swatch" style="background:' + tok("--green") + '"></span>' + loc().weekday + '</div>' +
      '<div class="item"><span class="swatch" style="background:' + tok("--blue") + '"></span>' + loc().saturday + '</div>' +
      '<div class="item"><span class="swatch" style="background:' + tok("--amber") + '"></span>' + loc().sunday + '</div>';

    var n = allCities.length;
    var gap = pw / n;
    var barW = gap * 0.56;
    allCities.forEach(function (o, i) {
      var cx = ML + gap * i + gap / 2;
      var segs = [["WEEKDAY", tok("--green"), loc().weekday], ["SATURDAY", tok("--blue"), loc().saturday], ["SUNDAY", tok("--amber"), loc().sunday]];
      var yCursor = yPos(0);
      segs.forEach(function (s) {
        var v = o.d[s[0]];
        if (v <= 0) return;
        var yTop = yCursor - (v / vmax) * ph;
        var r = el("rect", { x: cx - barW / 2, y: yTop, width: barW, height: yCursor - yTop - 1.5, fill: s[1], style: "cursor:pointer" }, svg);
        r.addEventListener("mousemove", function (e) {
          showTip("<b>" + cn(o.city) + "</b> (" + o.d.label + ")<br>" + s[2] + ": <b>" + fmt(v) + "</b> " + loc().segmentKeysWord, e);
        });
        r.addEventListener("mouseleave", hideTip);
        yCursor = yTop - 1.5;
      });
      el("text", { x: cx, y: H - MB + 18, "text-anchor": "middle", class: "muted" }, svg).textContent = cn(o.city);
      el("text", { x: cx, y: H - MB + 32, "text-anchor": "middle", class: "muted" }, svg).textContent = "(" + o.d.label + ")";
    });
  }

  // ================= data tables =================
  function buildTables() {
    var host = document.getElementById("data-tables");
    function table(title, cols, cities, rowsData, suffix, dec) {
      var html = '<div class="table-wrap" style="margin:0.6rem 0 1.1rem;"><table><caption style="text-align:left; font-weight:700; padding:0.4rem 0.7rem; font-size:0.85rem;">' + title + '</caption><thead><tr><th>' + loc().tblCity + '</th>';
      cols.forEach(function (c) { html += "<th>" + c + "</th>"; });
      html += "</tr></thead><tbody>";
      cities.forEach(function (city) {
        html += "<tr><td>" + cn(city) + "</td>";
        rowsData[city].forEach(function (v) { html += '<td class="num">' + (v == null ? "—" : fmt(v, dec) + (suffix || "")) + "</td>"; });
        html += "</tr>";
      });
      html += "</tbody></table></div>";
      return html;
    }
    var W1 = WINDOW_LABELS.r1[getLang()], W2 = WINDOW_LABELS.r2[getLang()];
    var out = "";
    out += table(loc().tblRound1Matched, W1, r1.cities, r1.matched, "", 0);
    out += table(loc().tblRound1Reject, W1, r1.cities, r1.reject, "%", 2);
    out += table(loc().tblRound1Thin, W1, r1.cities, r1.thinPct, "%", 1);
    out += table(loc().tblRound2Matched, W2, r2.cities, r2.matched, "", 0);
    out += table(loc().tblRound2Reject, W2, r2.cities, r2.reject, "%", 2);
    out += table(loc().tblRound2Thin, W2, r2.cities, r2.thinPct, "%", 1);

    var convHtml = '<div class="table-wrap" style="margin:0.6rem 0;"><table><caption style="text-align:left; font-weight:700; padding:0.4rem 0.7rem; font-size:0.85rem;">' + loc().tblConvCaption + '</caption>' +
      "<thead><tr><th>" + loc().tblTransition + "</th><th>" + loc().tblCity + "</th><th>" + loc().tblMedianP50 + "</th><th>" + loc().tblP90P50 + "</th><th>" + loc().tblMedianP85 + "</th><th>" + loc().tblP90P85 + "</th></tr></thead><tbody>";
    convergence.forEach(function (g) {
      g.items.forEach(function (it) {
        convHtml += '<tr><td>' + loc().groups[g.idx] + '</td><td>' + cn(it.city) + '</td><td class="num">' + fmt(it.dP50, 1) + ' s</td><td class="num">' + fmt(it.p90P50, 1) + ' s</td><td class="num">' + fmt(it.dP85, 1) + ' s</td><td class="num">' + fmt(it.p90P85, 1) + " s</td></tr>";
      });
    });
    convHtml += "</tbody></table></div>";
    out += convHtml;

    host.innerHTML = out;
  }

  // ================= render everything, re-run on language toggle =================
  function renderAll() {
    var W1 = WINDOW_LABELS.r1[getLang()], W2 = WINDOW_LABELS.r2[getLang()];
    document.getElementById("lbl-round1-r2").textContent = loc().round1Label;
    document.getElementById("lbl-round2-r2").textContent = loc().round2Label;
    document.getElementById("lbl-round1-r3").textContent = loc().round1Label;
    document.getElementById("lbl-round2-r3").textContent = loc().round2Label;

    lineChart("chart-matched-r1", "leg-matched-r1", r1, W1);
    lineChart("chart-matched-r2", "leg-matched-r2", r2, W2);
    heatmap("hm-reject-r1", r1.reject, r1.cities, W1, "%", 1);
    heatmap("hm-reject-r2", r2.reject, r2.cities, W2, "%", 1);
    heatmap("hm-thin-r1", r1.thinPct, r1.cities, W1, "%", 1);
    heatmap("hm-thin-r2", r2.thinPct, r2.cities, W2, "%", 1);
    convergenceChart("chart-convergence", "leg-conv", convergence);
    daytypeChart("chart-daytype", "leg-daytype", [r1, r2]);
    buildTables();
  }

  renderAll();
  setLangChangeHandler(renderAll);
})();
</script>
